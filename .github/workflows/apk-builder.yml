name: APK Builder

on:
  workflow_dispatch:
    inputs:
      output:
        description: "Build output"
        required: true
        type: choice
        options: [apk, aab]
        default: apk

      build_type:
        description: "Build type"
        required: true
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check LiveTV.zip
        run: |
          echo "Checking repository..."

          if [ ! -f "LiveTV.zip" ]; then
            echo "ERROR: LiveTV.zip was not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "LiveTV.zip found"
          ls -lh LiveTV.zip

      - name: Extract LiveTV.zip
        run: |
          echo "Extracting LiveTV.zip..."

          rm -rf extracted
          mkdir -p extracted

          unzip -o LiveTV.zip -d extracted

          echo ""
          echo "ZIP extracted successfully."
          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 6 -type f | head -300

      - name: Find Android project
        id: project
        run: |
          echo "Searching for gradlew..."

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew was not found inside LiveTV.zip."
            echo ""
            echo "Directories found:"
            find extracted -type d | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Checking app/src..."

          if [ ! -d "$PROJECT_DIR/app/src" ]; then
            echo ""
            echo "ERROR: app/src was not found."
            echo ""
            echo "Available src directories:"
            find "$PROJECT_DIR" -type d -name "src"
            exit 1
          fi

          echo ""
          echo "app/src found:"
          echo "$PROJECT_DIR/app/src"

          echo ""
          echo "Android source files:"
          find "$PROJECT_DIR/app/src" -type f | head -300

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | head -300

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: chmod +x gradlew

      - name: Show Gradle version
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew --version

      - name: Build debug APK
        if: inputs.output == 'apk' && inputs.build_type == 'debug'
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        if: inputs.output == 'apk' && inputs.build_type == 'release'
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug AAB
        if: inputs.output == 'aab' && inputs.build_type == 'debug'
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew bundleDebug --no-daemon

      - name: Build release AAB
        if: inputs.output == 'aab' && inputs.build_type == 'release'
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Find generated APK/AAB
        id: output
        run: |
          echo "Searching for generated APK/AAB..."

          OUTPUT_FILE=$(find \
            "${{ steps.project.outputs.project_dir }}" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -path "*/build/outputs/*" \
            | head -n 1)

          if [ -z "$OUTPUT_FILE" ]; then
            echo ""
            echo "ERROR: No APK or AAB was generated."
            echo ""
            echo "Build output directories:"
            find \
              "${{ steps.project.outputs.project_dir }}" \
              -type d \
              -path "*/build/outputs/*"
            exit 1
          fi

          echo ""
          echo "Build found:"
          echo "$OUTPUT_FILE"

          echo "output_file=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-output
          path: ${{ steps.output.outputs.output_file }}
          if-no-files-found: error