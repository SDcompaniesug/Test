name: APK Builder

on:
  workflow_dispatch:
    inputs:
      output:
        description: "Build output"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - aab

      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # SHOW REPOSITORY
      # ============================================================

      - name: Show repository
        shell: bash
        run: |
          echo "========================================"
          echo "REPOSITORY"
          echo "========================================"

          echo "Working directory:"
          pwd

          echo ""
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -300

      # ============================================================
      # CHECK LIVETV.ZIP
      # ============================================================

      - name: Check LiveTV.zip
        shell: bash
        run: |
          echo "========================================"
          echo "CHECKING LIVETV.ZIP"
          echo "========================================"

          if [ ! -f "LiveTV.zip" ]; then
            echo "ERROR: LiveTV.zip was not found."
            echo ""
            ls -la
            exit 1
          fi

          echo "LiveTV.zip found:"
          ls -lh LiveTV.zip

      # ============================================================
      # EXTRACT LIVETV.ZIP
      # ============================================================

      - name: Extract LiveTV.zip
        shell: bash
        run: |
          echo "========================================"
          echo "EXTRACTING LIVETV.ZIP"
          echo "========================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -q LiveTV.zip -d extracted

          echo ""
          echo "Extraction completed."

          echo ""
          echo "Extracted project:"
          find extracted -maxdepth 4 -type f | sort | head -400

      # ============================================================
      # FIND ANDROID PROJECT
      # ============================================================

      - name: Find Android project
        shell: bash
        run: |
          echo "========================================"
          echo "FINDING ANDROID PROJECT"
          echo "========================================"

          GRADLEW=$(find extracted -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo ""
            echo "Extracted directories:"
            find extracted -maxdepth 5 -type d | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # SHOW ANDROID PROJECT
      # ============================================================

      - name: Show Android project
        shell: bash
        run: |
          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort | head -500

      # ============================================================
      # JDK 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      #
      # IMPORTANT:
      # v4 ONLY
      #
      # DO NOT USE:
      # android-actions/setup-android@v3
      #
      # DO NOT INSTALL:
      # sdkmanager "tools"
      #
      # DO NOT USE:
      # yes | sdkmanager --licenses
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: "true"

      # ============================================================
      # INSTALL ANDROID SDK PACKAGES
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "========================================"
          echo "INSTALLING ANDROID SDK"
          echo "========================================"

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "========================================"
          echo "VERIFYING ANDROID SDK"
          echo "========================================"

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not set}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not set}"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          adb version

          echo ""
          echo "SDK Manager:"
          sdkmanager --version

          echo ""
          echo "Installed packages:"
          sdkmanager --list_installed | head -200

          echo ""
          echo "Checking Android 35..."

          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-35" ]; then
            echo "ERROR: Android API 35 is missing."
            exit 1
          fi

          echo "Android API 35: OK"

          echo ""
          echo "Checking Build Tools 35.0.0..."

          if [ ! -d "$ANDROID_SDK_ROOT/build-tools/35.0.0" ]; then
            echo "ERROR: Build Tools 35.0.0 are missing."
            exit 1
          fi

          echo "Build Tools 35.0.0: OK"

      # ============================================================
      # SHOW GRADLE FILES
      # ============================================================

      - name: Show Gradle files
        shell: bash
        run: |
          echo "========================================"
          echo "GRADLE PROJECT FILES"
          echo "========================================"

          echo ""
          echo "Gradle wrapper:"
          ls -lah "$PROJECT_DIR/gradlew"

          echo ""
          echo "Settings:"
          find "$PROJECT_DIR" -maxdepth 3 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

          echo ""
          echo "Build files:"
          find "$PROJECT_DIR" -maxdepth 4 \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

          echo ""
          echo "Gradle properties:"
          find "$PROJECT_DIR" -maxdepth 3 \
            -name "gradle.properties" \
            -print

      # ============================================================
      # CHECK MANIFEST AND RESOURCES
      # ============================================================

      - name: Check Android resources
        shell: bash
        run: |
          echo "========================================"
          echo "CHECKING ANDROID RESOURCES"
          echo "========================================"

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            echo ""
            echo "AndroidManifest.xml:"
            cat "$MANIFEST"
          else
            echo "WARNING: AndroidManifest.xml was not found at:"
            echo "$MANIFEST"
          fi

          echo ""
          echo "Launcher resources:"

          find "$PROJECT_DIR/app/src/main/res" \
            -type f \
            \( \
              -name "ic_launcher*" \
              -o -name "ic_launcher_foreground*" \
              -o -name "ic_launcher_background*" \
            \) \
            -print 2>/dev/null || true

      # ============================================================
      # MAKE GRADLE EXECUTABLE
      # ============================================================

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

          ls -lh "$PROJECT_DIR/gradlew"

      # ============================================================
      # JAVA VERSION
      # ============================================================

      - name: Show Java version
        shell: bash
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

      # ============================================================
      # GRADLE VERSION
      # ============================================================

      - name: Show Gradle version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          ./gradlew --version

      # ============================================================
      # GRADLE PROJECT CHECK
      # ============================================================

      - name: Check Gradle project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "CHECKING GRADLE PROJECT"
          echo "========================================"

          ./gradlew tasks \
            --stacktrace \
            --no-daemon \
            --console=plain

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build APK
        if: ${{ inputs.output == 'apk' }}
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          if [ "${{ inputs.build_type }}" = "release" ]; then

            echo "Build type: RELEASE"

            ./gradlew assembleRelease \
              --stacktrace \
              --no-daemon \
              --console=plain \
              --info

          else

            echo "Build type: DEBUG"

            ./gradlew assembleDebug \
              --stacktrace \
              --no-daemon \
              --console=plain \
              --info

          fi

      # ============================================================
      # BUILD AAB
      # ============================================================

      - name: Build AAB
        if: ${{ inputs.output == 'aab' }}
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "BUILDING AAB"
          echo "========================================"

          if [ "${{ inputs.build_type }}" = "release" ]; then

            echo "Build type: RELEASE"

            ./gradlew bundleRelease \
              --stacktrace \
              --no-daemon \
              --console=plain \
              --info

          else

            echo "Build type: DEBUG"

            ./gradlew bundleDebug \
              --stacktrace \
              --no-daemon \
              --console=plain \
              --info

          fi

      # ============================================================
      # SHOW OUTPUTS
      # ============================================================

      - name: Show build outputs
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD OUTPUTS"
          echo "========================================"

          echo ""
          echo "APK:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

          echo ""
          echo "AAB:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.aab" \
            -print 2>/dev/null || true

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================

      - name: Prepare build artifact
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "PREPARING ARTIFACT"
          echo "========================================"

          rm -rf artifacts
          mkdir -p artifacts

          if [ "${{ inputs.output }}" = "apk" ]; then

            OUTPUT=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/*" \
              -print -quit)

          else

            OUTPUT=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.aab" \
              -path "*/build/outputs/*" \
              -print -quit)

          fi

          if [ -z "$OUTPUT" ]; then
            echo "ERROR: Build succeeded but no output was found."
            exit 1
          fi

          echo "Output:"
          echo "$OUTPUT"

          cp "$OUTPUT" artifacts/

          echo ""
          echo "Prepared artifact:"
          ls -lah artifacts/

      # ============================================================
      # UPLOAD APK / AAB
      # ============================================================

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: LiveTV-${{ inputs.output }}-${{ inputs.build_type }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # UPLOAD BUILD REPORTS ON FAILURE
      # ============================================================

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: LiveTV-build-reports
          path: |
            extracted/**/build/reports/**
            extracted/**/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 7
