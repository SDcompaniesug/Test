name: APK Builder

on:
  workflow_dispatch:
    inputs:
      output:
        description: "Build output"
        required: true
        type: choice
        options:
          - apk
          - aab
        default: apk

      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "========================================"
          echo "REPOSITORY CONTENTS"
          echo "========================================"

          pwd
          echo ""

          ls -lah
          echo ""

          find . -maxdepth 3 -type f | sort | head -300

      - name: Check LiveTV.zip
        run: |
          echo "========================================"
          echo "CHECKING LiveTV.zip"
          echo "========================================"

          if [ ! -f "LiveTV.zip" ]; then
            echo ""
            echo "ERROR: LiveTV.zip was not found."
            echo ""
            echo "Files in repository:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "LiveTV.zip found:"
          ls -lh LiveTV.zip

      - name: Extract LiveTV.zip
        run: |
          echo "========================================"
          echo "EXTRACTING LiveTV.zip"
          echo "========================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -o LiveTV.zip -d extracted

          echo ""
          echo "Extraction completed."
          echo ""

          find extracted -maxdepth 6 -type f | sort | head -500

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "========================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "========================================"

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew was not found."
            echo ""
            echo "Possible Gradle files:"

            find extracted -type f \
              \( -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              | sort

            echo ""
            echo "Directories:"
            find extracted -type d | sort | head -500

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo ""
          echo "gradlew:"
          echo "$GRADLEW"

          echo ""
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then

            echo ""
            echo "WARNING: settings.gradle/settings.gradle.kts was not found."
            echo ""
            echo "Project files:"

            find "$PROJECT_DIR" -maxdepth 2 -type f | sort
          fi

          if [ ! -d "$PROJECT_DIR/app/src" ]; then
            echo ""
            echo "ERROR: app/src was not found."
            echo ""
            echo "Available src directories:"

            find "$PROJECT_DIR" -type d -name "src" | sort

            echo ""
            echo "Project tree:"

            find "$PROJECT_DIR" -maxdepth 4 -type f \
              | sort \
              | head -500

            exit 1
          fi

          echo ""
          echo "app/src found:"
          echo "$PROJECT_DIR/app/src"

          echo ""
          echo "Android source files:"

          find "$PROJECT_DIR/app/src" -type f \
            | sort \
            | head -500

          echo ""
          echo "Gradle files:"

          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            | sort

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          echo "========================================"
          echo "ACCEPTING ANDROID SDK LICENSES"
          echo "========================================"

          set +e

          yes | sdkmanager --licenses

          LICENSE_EXIT=$?

          echo ""
          echo "sdkmanager license process exited with: $LICENSE_EXIT"

          # Do not stop the workflow here.
          exit 0

      - name: Show Android SDK information
        shell: bash
        run: |
          echo "========================================"
          echo "ANDROID SDK INFORMATION"
          echo "========================================"

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed SDK packages:"

          sdkmanager --list_installed || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ls -lh gradlew

      - name: Show Java version
        run: |
          java -version
          echo ""
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Show Gradle version
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew --version

      - name: Check Gradle project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "========================================"
          echo "GRADLE PROJECT CHECK"
          echo "========================================"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace \
            --info

      - name: Build APK
        if: ${{ inputs.output == 'apk' }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          if [ "${{ inputs.build_type }}" = "debug" ]; then

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --info

          else

            ./gradlew assembleRelease \
              --no-daemon \
              --stacktrace \
              --info

          fi

      - name: Build AAB
        if: ${{ inputs.output == 'aab' }}
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "========================================"
          echo "BUILDING AAB"
          echo "========================================"

          if [ "${{ inputs.build_type }}" = "debug" ]; then

            ./gradlew bundleDebug \
              --no-daemon \
              --stacktrace \
              --info

          else

            ./gradlew bundleRelease \
              --no-daemon \
              --stacktrace \
              --info

          fi

      - name: Show build outputs
        if: always()
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "========================================"
          echo "BUILD OUTPUTS"
          echo "========================================"

          echo ""
          echo "APK/AAB files:"

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            | sort

          echo ""
          echo "Build output directories:"

          find . -type d \
            -path "*/build/outputs/*" \
            | sort

      - name: Find generated output
        id: output
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "SEARCHING FOR GENERATED OUTPUT"
          echo "========================================"

          OUTPUT_FILE=$(find \
            "${{ steps.project.outputs.project_dir }}" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -path "*/build/outputs/*" \
            | head -n 1)

          if [ -z "$OUTPUT_FILE" ]; then

            echo ""
            echo "ERROR: No APK or AAB was generated."

            echo ""
            echo "Build output directories:"

            find \
              "${{ steps.project.outputs.project_dir }}" \
              -type d \
              -path "*/build/outputs/*" \
              | sort

            echo ""
            echo "Gradle reports:"

            find \
              "${{ steps.project.outputs.project_dir }}" \
              -type f \
              -path "*/build/reports/*" \
              | sort \
              | head -200

            exit 1
          fi

          echo ""
          echo "OUTPUT FOUND:"
          echo "$OUTPUT_FILE"

          echo ""
          ls -lh "$OUTPUT_FILE"

          echo "output_file=$OUTPUT_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-output
          path: ${{ steps.output.outputs.output_file }}
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-debug-reports
          path: |
            ${{ steps.project.outputs.project_dir }}/**/build/reports/**
            ${{ steps.project.outputs.project_dir }}/**/build/outputs/logs/**
          if-no-files-found: warn

Then do this

1. Open ".github/workflows/apk-builder.yml".
2. Delete the old contents.
3. Paste the complete workflow above.
4. Commit changes.
5. Go back to Actions → APK Builder.
6. Tap Run workflow.
7. Select:
   - output: "apk"
   - build_type: "debug"
8. Run it.

The important change is that the workflow now explicitly processes the SDK licenses and prints the installed SDK information before Gradle starts.

If the new run fails after "GRADLE PROJECT CHECK", send me the new red error section. That will be the actual project/Gradle error rather than the SDK license problem.
