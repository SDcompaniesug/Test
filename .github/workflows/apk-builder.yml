name: APK Builder

on:
  workflow_dispatch:
    inputs:
      output:
        description: "Build output"
        required: true
        type: choice
        options:
          - apk
          - aab
        default: apk

      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Show repository
      # --------------------------------------------------

      - name: Show repository
        run: |
          echo "========================================"
          echo "REPOSITORY CONTENTS"
          echo "========================================"

          pwd
          echo ""

          ls -lah
          echo ""

          find . -maxdepth 3 -type f | sort | head -300

      # --------------------------------------------------
      # 3. Check LiveTV.zip
      # --------------------------------------------------

      - name: Check LiveTV.zip
        run: |
          echo "========================================"
          echo "CHECKING LiveTV.zip"
          echo "========================================"

          if [ ! -f "LiveTV.zip" ]; then
            echo ""
            echo "ERROR: LiveTV.zip was not found."
            echo ""
            echo "Files in repository:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "LiveTV.zip found:"
          ls -lh LiveTV.zip

      # --------------------------------------------------
      # 4. Extract project
      # --------------------------------------------------

      - name: Extract LiveTV.zip
        run: |
          echo "========================================"
          echo "EXTRACTING LiveTV.zip"
          echo "========================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -o LiveTV.zip -d extracted

          echo ""
          echo "Extraction completed."
          echo ""

          find extracted -maxdepth 6 -type f | sort | head -500

      # --------------------------------------------------
      # 5. Find Android project
      # --------------------------------------------------

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "========================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "========================================"

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew was not found."
            echo ""
            echo "Possible Gradle files:"

            find extracted -type f \
              \( -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo ""
          echo "Gradle wrapper found:"
          echo "$GRADLEW"
          echo ""

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 6. Set executable permission
      # --------------------------------------------------

      - name: Make Gradle executable
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          chmod +x "$PROJECT_DIR/gradlew"

          ls -l "$PROJECT_DIR/gradlew"

      # --------------------------------------------------
      # 7. Set up JDK 17
      # --------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 8. Set up Android SDK
      # --------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # --------------------------------------------------
      # 9. Accept Android SDK licenses
      # --------------------------------------------------

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          echo "========================================"
          echo "ACCEPTING ANDROID SDK LICENSES"
          echo "========================================"

          yes | sdkmanager --licenses > /dev/null || true

          echo ""
          echo "SDK licenses processed."

      # --------------------------------------------------
      # 10. Install required Android SDK packages
      # --------------------------------------------------

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "========================================"
          echo "INSTALLING ANDROID SDK PACKAGES"
          echo "========================================"

          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK packages installed."

      # --------------------------------------------------
      # 11. Accept licenses again after installation
      # --------------------------------------------------

      - name: Verify SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          echo ""
          echo "Installed SDK packages:"
          sdkmanager --list_installed | head -100

      # --------------------------------------------------
      # 12. Show Gradle project
      # --------------------------------------------------

      - name: Show Gradle project
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -300

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # --------------------------------------------------
      # 13. Build APK
      # --------------------------------------------------

      - name: Build APK
        if: inputs.output == 'apk'
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          BUILD_TYPE="${{ inputs.build_type }}"

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          echo "Build type: $BUILD_TYPE"
          echo ""

          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease \
              --stacktrace \
              --no-daemon
          else
            ./gradlew assembleDebug \
              --stacktrace \
              --no-daemon
          fi

      # --------------------------------------------------
      # 14. Build AAB
      # --------------------------------------------------

      - name: Build AAB
        if: inputs.output == 'aab'
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          BUILD_TYPE="${{ inputs.build_type }}"

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING AAB"
          echo "========================================"

          echo "Build type: $BUILD_TYPE"
          echo ""

          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew bundleRelease \
              --stacktrace \
              --no-daemon
          else
            ./gradlew bundleDebug \
              --stacktrace \
              --no-daemon
          fi

      # --------------------------------------------------
      # 15. Find generated files
      # --------------------------------------------------

      - name: Find build outputs
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD OUTPUTS"
          echo "========================================"

          echo ""
          echo "APK files:"
          find extracted -type f -name "*.apk" -print

          echo ""
          echo "AAB files:"
          find extracted -type f -name "*.aab" -print

          echo ""
          echo "Build reports:"
          find extracted -type f -path "*/build/reports/*" -print | head -100

      # --------------------------------------------------
      # 16. Prepare APK artifact
      # --------------------------------------------------

      - name: Prepare APK artifact
        if: success() && inputs.output == 'apk'
        shell: bash
        run: |
          rm -rf output
          mkdir -p output

          APK=$(find extracted -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo ""
            find extracted -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" output/app-${{ inputs.build_type }}.apk

          echo ""
          echo "Prepared artifact:"
          ls -lh output/

      # --------------------------------------------------
      # 17. Prepare AAB artifact
      # --------------------------------------------------

      - name: Prepare AAB artifact
        if: success() && inputs.output == 'aab'
        shell: bash
        run: |
          rm -rf output
          mkdir -p output

          AAB=$(find extracted -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: No AAB was generated."
            echo ""
            find extracted -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "Found AAB:"
          echo "$AAB"

          cp "$AAB" output/app-${{ inputs.build_type }}.aab

          echo ""
          echo "Prepared artifact:"
          ls -lh output/

      # --------------------------------------------------
      # 18. Upload APK/AAB
      # --------------------------------------------------

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LiveTV-${{ inputs.output }}-${{ inputs.build_type }}
          path: output/
          if-no-files-found: error
          retention-days: 7
